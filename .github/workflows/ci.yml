name: CI - Build and Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      dds_impl:
        description: DDS implementation
        required: true
        default: fastdds
        type: choice
        options:
          - fastdds
          - txdds

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libgtest-dev \
            libssl-dev \
            libsndfile1-dev \
            libasio-dev

      - name: Build and install googletest
        run: |
          cd /usr/src/googletest
          sudo cmake -B build -S .
          sudo cmake --build build -j"$(nproc)"
          sudo cmake --install build

  build:
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 20
    env:
      DDS_IMPL: ${{ github.event.inputs.dds_impl || 'fastdds' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore TXDDS symlinks
        if: env.DDS_IMPL == 'txdds'
        run: |
          cd thirdparty/txdds/lib
          ln -sf libssl.so.1.1 libssl.so
          ln -sf libcrypto.so.1.1 libcrypto.so
          ln -sf libTXDDS.so.3.00.2605.2.202605191059 libTXDDS.so
          ln -sf libTXCDR.so.3.00.2605.2.202605191059 libTXCDR.so

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libgtest-dev \
            libssl-dev \
            libsndfile1-dev \
            libasio-dev

      - name: Build and install googletest
        run: |
          cd /usr/src/googletest
          sudo cmake -B build -S .
          sudo cmake --build build -j"$(nproc)"
          sudo cmake --install build

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          source ../.env
          if [ "$DDS_IMPL" = "txdds" ]; then
            cmake .. -DUSE_TXDDS=ON -DENABLE_TESTS=ON
          else
            cmake .. -DUSE_FASTDDS=ON -DENABLE_TESTS=ON
          fi

      - name: Compile project
        run: |
          cd build
          source ../.env
          make -j"$(nproc)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    env:
      DDS_IMPL: ${{ github.event.inputs.dds_impl || 'fastdds' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libgtest-dev \
            libssl-dev \
            libsndfile1-dev \
            libasio-dev

      - name: Restore TXDDS symlinks
        if: env.DDS_IMPL == 'txdds'
        run: |
          cd thirdparty/txdds/lib
          ln -sf libssl.so.1.1 libssl.so
          ln -sf libcrypto.so.1.1 libcrypto.so
          ln -sf libTXDDS.so.3.00.2605.2.202605191059 libTXDDS.so
          ln -sf libTXCDR.so.3.00.2605.2.202605191059 libTXCDR.so

      - name: Build and install googletest
        run: |
          cd /usr/src/googletest
          sudo cmake -B build -S .
          sudo cmake --build build -j"$(nproc)"
          sudo cmake --install build

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build/

      - name: Run unit tests
        run: |
          cd build
          source ../.env
          mkdir -p test-results
          chmod +x ./tests/test_log ./tests/test_timer ./tests/test_ddswrapper ./tests/test_ondemand || true
          ls -l ./tests/test_log ./tests/test_timer ./tests/test_ddswrapper ./tests/test_ondemand

          echo "========== Running test_log =========="
          timeout 180s ./tests/test_log --gtest_output=xml:test-results/test_log.xml

          echo "========== Running test_timer =========="
          timeout 180s ./tests/test_timer --gtest_output=xml:test-results/test_timer.xml

          echo "========== Running test_ddswrapper =========="
          timeout 180s ./tests/test_ddswrapper --gtest_output=xml:test-results/test_ddswrapper.xml

          echo "========== Running test_ondemand (exclude known flaky CI cases) =========="
          timeout 420s ./tests/test_ondemand \
            --gtest_output=xml:test-results/test_ondemand.xml \
            --gtest_filter=-OnDemandPubSub.SubFirstThenPubRestartRecovery:OnDemandPubSub.PubFirstThenSubRestartRecovery

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  report:
    runs-on: ubuntu-latest
    needs: [ build, test ]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate HTML report
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          mkdir -p report
          python3 - <<'PY'
          import html
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path("artifacts")
          report_dir = pathlib.Path("report")
          xml_files = sorted(root.glob("**/*.xml"))

          suites = []
          total_tests = total_failures = total_errors = total_skipped = 0

          for xml_file in xml_files:
              try:
                  tree = ET.parse(xml_file)
              except ET.ParseError:
                  continue
              suite_nodes = tree.findall(".//testsuite")
              if not suite_nodes and tree.getroot().tag == "testsuite":
                  suite_nodes = [tree.getroot()]
              for suite in suite_nodes:
                  name = suite.attrib.get("name", xml_file.stem)
                  tests = int(suite.attrib.get("tests", "0") or 0)
                  failures = int(suite.attrib.get("failures", "0") or 0)
                  errors = int(suite.attrib.get("errors", "0") or 0)
                  skipped = int(suite.attrib.get("skipped", "0") or 0)
                  time = suite.attrib.get("time", "0")
                  total_tests += tests
                  total_failures += failures
                  total_errors += errors
                  total_skipped += skipped
                  cases = []
                  for case in suite.findall("testcase"):
                      case_name = case.attrib.get("name", "unknown")
                      case_time = case.attrib.get("time", "0")
                      status = "passed"
                      message = ""
                      failure = case.find("failure")
                      error = case.find("error")
                      skipped_node = case.find("skipped")
                      if failure is not None:
                          status = "failed"
                          message = failure.attrib.get("message", failure.text or "")
                      elif error is not None:
                          status = "error"
                          message = error.attrib.get("message", error.text or "")
                      elif skipped_node is not None:
                          status = "skipped"
                          message = skipped_node.attrib.get("message", skipped_node.text or "")
                      cases.append({"name": case_name, "time": case_time, "status": status, "message": message})
                  suites.append({"name": name, "tests": tests, "failures": failures, "errors": errors, "skipped": skipped, "time": time, "cases": cases, "source": str(xml_file)})

          def esc(value):
              return html.escape(str(value))

          cards = f"""
          <div class='grid'>
            <div class='card {'ok' if os.environ.get('BUILD_RESULT') == 'success' else 'bad'}'><div class='label'>Build</div><div class='value'>{esc(os.environ.get('BUILD_RESULT', 'unknown'))}</div></div>
            <div class='card {'ok' if os.environ.get('TEST_RESULT') == 'success' else 'bad'}'><div class='label'>Test</div><div class='value'>{esc(os.environ.get('TEST_RESULT', 'unknown'))}</div></div>
            <div class='card'><div class='label'>Suites</div><div class='value'>{len(suites)}</div></div>
            <div class='card'><div class='label'>Cases</div><div class='value'>{total_tests}</div></div>
            <div class='card {'bad' if total_failures or total_errors else 'ok'}'><div class='label'>Failures</div><div class='value'>{total_failures + total_errors}</div></div>
            <div class='card'><div class='label'>Skipped</div><div class='value'>{total_skipped}</div></div>
          </div>
          """

          suite_html = []
          for suite in suites:
              rows = []
              for case in suite["cases"]:
                  badge_class = {
                      "passed": "good",
                      "failed": "bad",
                      "error": "bad",
                      "skipped": "muted",
                  }[case["status"]]
                  message = esc(case["message"]) if case["message"] else ""
                  rows.append(f"<tr><td>{esc(case['name'])}</td><td>{esc(case['time'])}s</td><td><span class='pill {badge_class}'>{esc(case['status'])}</span></td><td>{message}</td></tr>")
              suite_html.append(f"""
              <section class='suite'>
                <div class='suite-head'>
                  <h2>{esc(suite['name'])}</h2>
                  <div class='meta'>{esc(suite['source'])} · {suite['tests']} cases · {suite['time']}s</div>
                </div>
                <div class='suite-stats'>
                  <span class='pill good'>{suite['tests']} tests</span>
                  <span class='pill {'bad' if suite['failures'] or suite['errors'] else 'good'}'>{suite['failures'] + suite['errors']} failed</span>
                  <span class='pill muted'>{suite['skipped']} skipped</span>
                </div>
                <table>
                  <thead><tr><th>Case</th><th>Time</th><th>Status</th><th>Message</th></tr></thead>
                  <tbody>{''.join(rows)}</tbody>
                </table>
              </section>
              """)

          html_doc = f"""<!doctype html>
          <html lang='zh-CN'>
          <head>
            <meta charset='utf-8'>
            <meta name='viewport' content='width=device-width, initial-scale=1'>
            <title>CI Report</title>
            <style>
              :root {{
                color-scheme: dark;
                --bg: #0b1020;
                --panel: rgba(16, 24, 48, .86);
                --border: rgba(148, 163, 184, .18);
                --text: #e5eefb;
                --muted: #92a4c3;
                --good: #2dd4bf;
                --bad: #fb7185;
                --accent: #7c3aed;
              }}
              * {{ box-sizing: border-box; }}
              body {{ margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: var(--text); background: radial-gradient(circle at top left, rgba(124,58,237,.35), transparent 24%), radial-gradient(circle at top right, rgba(45,212,191,.18), transparent 26%), var(--bg); }}
              .wrap {{ max-width: 1180px; margin: 0 auto; padding: 32px 20px 56px; }}
              .hero {{ padding: 28px; border: 1px solid var(--border); border-radius: 28px; background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03)); box-shadow: 0 24px 80px rgba(0,0,0,.35); }}
              .eyebrow {{ color: var(--muted); letter-spacing: .2em; text-transform: uppercase; font-size: 12px; }}
              h1 {{ margin: 10px 0 8px; font-size: clamp(34px, 4vw, 58px); line-height: 1.02; }}
              .sub {{ color: var(--muted); font-size: 15px; line-height: 1.7; }}
              .grid {{ display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; margin: 18px 0 28px; }}
              .card {{ padding: 18px; border: 1px solid var(--border); border-radius: 20px; background: var(--panel); }}
              .card.ok {{ box-shadow: inset 0 0 0 1px rgba(45,212,191,.08); }}
              .card.bad {{ box-shadow: inset 0 0 0 1px rgba(251,113,133,.14); }}
              .label {{ color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .14em; }}
              .value {{ margin-top: 10px; font-size: 28px; font-weight: 700; }}
              .suite {{ margin-top: 18px; padding: 22px; border: 1px solid var(--border); border-radius: 24px; background: rgba(12, 18, 36, .76); }}
              .suite-head {{ display: flex; justify-content: space-between; gap: 14px; align-items: baseline; flex-wrap: wrap; }}
              .suite h2 {{ margin: 0; font-size: 22px; }}
              .meta {{ color: var(--muted); font-size: 13px; }}
              .suite-stats {{ display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 18px; }}
              .pill {{ display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }}
              .pill.good {{ color: #67e8f9; background: rgba(45,212,191,.08); }}
              .pill.bad {{ color: #fda4af; background: rgba(251,113,133,.1); }}
              .pill.muted {{ color: var(--muted); background: rgba(148,163,184,.08); }}
              table {{ width: 100%; border-collapse: collapse; overflow: hidden; border-radius: 16px; }}
              th, td {{ text-align: left; padding: 12px 10px; border-bottom: 1px solid rgba(148,163,184,.12); vertical-align: top; }}
              th {{ color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .12em; }}
              td {{ font-size: 14px; }}
              .footer {{ color: var(--muted); font-size: 12px; margin-top: 18px; }}
              @media (max-width: 1080px) {{ .grid {{ grid-template-columns: repeat(2, minmax(0, 1fr)); }} }}
              @media (max-width: 640px) {{ .grid {{ grid-template-columns: 1fr; }} .hero, .suite {{ border-radius: 18px; }} }}
            </style>
          </head>
          <body>
            <div class='wrap'>
              <div class='hero'>
                <div class='eyebrow'>OnDemand CI</div>
                <h1>Build and Test Report</h1>
                <div class='sub'>This page summarizes the current workflow run, including build status and test suite results extracted from GoogleTest XML artifacts.</div>
                {cards}
                <div class='footer'>Generated from workflow artifacts. Build status: {esc(os.environ.get('BUILD_RESULT', 'unknown'))}, test status: {esc(os.environ.get('TEST_RESULT', 'unknown'))}.</div>
              </div>
              {''.join(suite_html) if suite_html else '<div class="suite"><h2>No XML test results found</h2><div class="meta">The test stage did not upload any XML files to artifacts.</div></div>'}
            </div>
          </body>
          </html>"""

          (report_dir / "index.html").write_text(html_doc, encoding="utf-8")

          build_result = os.environ.get('BUILD_RESULT', 'unknown')
          test_result  = os.environ.get('TEST_RESULT',  'unknown')

          (report_dir / "summary.txt").write_text(
              f"build={build_result}\ntest={test_result}\nsuites={len(suites)}\ntests={total_tests}\nfailures={total_failures}\nerrors={total_errors}\nskipped={total_skipped}\n",
              encoding="utf-8",
          )

          def esc(v):
              return html.escape(str(v))

          summary_lines = [
              "# CI Report", "",
              "## Overview",
              "| Item | Value |", "| --- | --- |",
              f"| Build | {esc(build_result)} |",
              f"| Test  | {esc(test_result)} |",
              f"| Suites | {len(suites)} |",
              f"| Cases | {total_tests} |",
              f"| Failures | {total_failures + total_errors} |",
              f"| Skipped | {total_skipped} |",
              "", "## Suite Breakdown",
          ]

          if suites:
              for suite in suites:
                  summary_lines += [
                      "<details>",
                      f"<summary><strong>{esc(suite['name'])}</strong> — {suite['tests']} cases, {suite['failures']+suite['errors']} failed</summary>",
                      "", f"Source: `{esc(suite['source'])}` · Time: {esc(suite['time'])}s", "",
                      "| Case | Time | Status | Message |", "| --- | --- | --- | --- |",
                  ]
                  for case in suite["cases"]:
                      summary_lines.append(
                          f"| {esc(case['name'])} | {esc(case['time'])}s | {esc(case['status'])} | {esc(case['message']) if case['message'] else ''} |"
                      )
                  summary_lines += ["</details>", ""]
          else:
              summary_lines.append("No XML test results found.")

          (report_dir / "summary.md").write_text("\n".join(summary_lines) + "\n", encoding="utf-8")
          PY
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: report/
          retention-days: 14
