name: CI - Build and Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      dds_impl:
        description: DDS implementation
        required: true
        default: fastdds
        type: choice
        options:
          - fastdds
          - txdds

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Prepare - checkout
        uses: actions/checkout@v5

      - name: Prepare - install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libgtest-dev \
            libssl-dev \
            libsndfile1-dev

      - name: Prepare - build googletest
        run: |
          cd /usr/src/googletest
          sudo cmake -B build -S .
          sudo cmake --build build -j"$(nproc)"
          sudo cmake --install build

      - name: Configure - CMake
        env:
          DDS_IMPL: ${{ github.event.inputs.dds_impl || 'fastdds' }}
        run: |
          mkdir -p build
          cd build
          source ../.env
          if [ "$DDS_IMPL" = "txdds" ]; then
            cmake .. -DUSE_TXDDS=ON -DENABLE_TESTS=ON
          else
            cmake .. -DUSE_FASTDDS=ON -DENABLE_TESTS=ON
          fi

      - name: Build - compile
        run: |
          cd build
          source ../.env
          make -j"$(nproc)"

      - name: Test - run unit tests
        run: |
          cd build
          source ../.env
          if command -v ctest >/dev/null 2>&1; then
            ctest --output-on-failure --verbose
          else
            ./tests/test_log
            ./tests/test_ddswrapper
            ./tests/test_ondemand
          fi

      - name: Test - upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: build/Testing/
          retention-days: 7

      - name: Report - summary
        if: always()
        run: |
          echo "## CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Prepare: done" >> "$GITHUB_STEP_SUMMARY"
          echo "- Configure: done" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: done" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test: done" >> "$GITHUB_STEP_SUMMARY"
