name: CI - Build and Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      dds_impl:
        description: DDS implementation
        required: true
        default: fastdds
        type: choice
        options:
          - fastdds
          - txdds

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libgtest-dev \
            libssl-dev \
            libsndfile1-dev

      - name: Build and install googletest
        run: |
          cd /usr/src/googletest
          sudo cmake -B build -S .
          sudo cmake --build build -j"$(nproc)"
          sudo cmake --install build

  build:
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 20
    env:
      DDS_IMPL: ${{ github.event.inputs.dds_impl || 'fastdds' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          source ../.env
          if [ "$DDS_IMPL" = "txdds" ]; then
            cmake .. -DUSE_TXDDS=ON -DENABLE_TESTS=ON
          else
            cmake .. -DUSE_FASTDDS=ON -DENABLE_TESTS=ON
          fi

      - name: Compile project
        run: |
          cd build
          source ../.env
          make -j"$(nproc)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build/

      - name: Run unit tests
        run: |
          cd build
          source ../.env
          echo "========== Running test_log =========="
          ./tests/test_log
          echo "========== Running test_ddswrapper =========="
          ./tests/test_ddswrapper
          echo "========== Running test_ondemand =========="
          ./tests/test_ondemand

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/Testing/
          retention-days: 7
          if-no-files-found: ignore

  report:
    runs-on: ubuntu-latest
    needs: [ build, test ]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate CI report
        run: |
          echo "# CI 流程报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 流程状态" >> $GITHUB_STEP_SUMMARY
          echo "- **准备阶段**: ✓ 完成" >> $GITHUB_STEP_SUMMARY
          echo "- **编译阶段**: ${{ needs.build.result == 'success' && '✓ 完成' || '✗ 失败' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **测试阶段**: ${{ needs.test.result == 'success' && '✓ 完成' || '✗ 失败' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "artifacts/test-results" ]; then
            echo "## 测试结果文件" >> $GITHUB_STEP_SUMMARY
            find artifacts/test-results -type f | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          fi
