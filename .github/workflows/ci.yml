name: CI - Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          git \
          libssl-dev \
          libsndfile1-dev

    - name: Setup environment
      run: |
        cd ${{ github.workspace }}
        source .env

    - name: Create build directory
      run: mkdir -p build

    - name: Configure with CMake (FastDDS)
      run: |
        cd build
        source ../.env
        cmake .. -DUSE_FASTDDS=ON -DENABLE_TESTS=ON
      
    - name: Build
      run: |
        cd build
        source ../.env
        make -j$(nproc)

    - name: Run tests
      run: |
        cd build
        source ../.env
        make test VERBOSE=1

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: build/Testing/
        retention-days: 7

    - name: Generate test report
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        if [ -f build/Testing/TAG ]; then
          echo "Tests completed. See artifacts for detailed results." >> $GITHUB_STEP_SUMMARY
        fi
